name: Officer UI read-only acceptance (isolated)
on:
  push:
    branches: [architecture-v2-foundation-20261015]
    paths:
      - 'frontend/e2e/officer-readonly-acceptance.spec.js'
      - 'frontend/playwright.config.js'
      - 'frontend/src/App.jsx'
      - 'frontend/src/components/intel/**'
      - 'frontend/package.json'
      - 'backend/app/main.py'
      - '.github/workflows/officer-ui-readonly-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend test dependencies
        run: pip install -r backend/requirements.txt
      - name: Install frontend test dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Install isolated Chromium runner
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run local SQLite authenticated browser smoke
        working-directory: frontend
        env:
          CI: 'true'
        run: npm run test:e2e:officer-readonly
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: officer-readonly-ui-failure-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
