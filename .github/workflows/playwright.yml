name: Playwright QA
on:
  push:
    branches: [architecture-v2-foundation-20261015]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      shards: ${{ steps.scope.outputs.shards }}
      specs: ${{ steps.scope.outputs.specs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select affected scope; unknown changes run full regression
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 .github/scripts/test_playwright_scope.py
          python3 .github/scripts/playwright_scope.py
  backend-regression:
    needs: plan
    # Staging pushes run the same full backend suite in the authoritative image workflow.
    # PRs and manually requested regression retain an independent backend check.
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Full offline backend regression
        working-directory: backend
        env:
          PYTHONPATH: .
          DATABASE_URL: 'sqlite:///:memory:'
          OPENAI_API_KEY: ""
          SOCIALCRAWL_API_KEY: ""
        run: pytest -q
  e2e:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      OPENAI_API_KEY: ""
      SOCIALCRAWL_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node22-${{ hashFiles('frontend/package.json') }}
          restore-keys: npm-${{ runner.os }}-node22-
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Administrator exception review frontend contracts
        if: needs.plan.outputs.scope == 'full' && matrix.shard == '1/3'
        working-directory: frontend
        run: |
          node scripts/test-assessment-exception-review-v1714.mjs
          node scripts/test-assessment-exception-review-v1715.mjs
          node scripts/test-assessment-review-gate-v1716.mjs
          node scripts/test-assessment-review-gate-v1717.mjs
          node scripts/test-assessment-review-gate-v1719.mjs
          node scripts/test-jurisdiction-regency-v1720.mjs
          node scripts/test-related-regency-v1721.mjs
          node scripts/test-related-regency-v1722.mjs
          node scripts/test-regency-officer-review-v1723.mjs
          node scripts/test-regency-review-consistency-v1724.mjs
          node scripts/test-regency-aliases-v1725.mjs
          node scripts/test-regency-eval-v1726.mjs
          node scripts/test-jurisdiction-readiness-v1727.mjs
          node scripts/test-jurisdiction-leads-v1728.mjs
          node scripts/test-jurisdiction-navigation-v1729.mjs
          node scripts/test-jurisdiction-contract-v1730.mjs
          node scripts/test-jurisdiction-bulk-v1731.mjs
      - name: Resolve exact installed Playwright version
        id: pw
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache browser binaries
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-ubuntu24-${{ runner.arch }}-${{ steps.pw.outputs.version }}
      - name: Restore Chromium on cache miss
        if: steps.browser-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        working-directory: frontend
        run: npx playwright install --only-shell chromium
      - name: Verify Chromium launches; repair dependencies only if needed
        timeout-minutes: 8
        working-directory: frontend
        run: |
          set -euo pipefail
          smoke() {
            node --input-type=module -e 'import {chromium} from "@playwright/test"; const browser=await chromium.launch({headless:true}); await browser.close();'
          }
          if ! smoke; then
            echo "Browser launch failed; repair the pinned Ubuntu 24.04 environment."
            npx playwright install --only-shell chromium
            npx playwright install-deps chromium
            smoke
          fi
      # Each runner has its own fresh database. No same-server worker races.
      - name: Run selected Playwright tests
        working-directory: frontend
        env:
          SPECS: ${{ needs.plan.outputs.specs }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          read -r -a specs <<< "$SPECS"
          npx playwright test "${specs[@]}" --shard="$SHARD" --grep-invert "provincial analyst only sees permitted navigation|Data Sources create and edit persists|unresolved jurisdiction blocks final validation" --max-failures=5 --retries=0 --reporter=line,html
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ strategy.job-index }}
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14
