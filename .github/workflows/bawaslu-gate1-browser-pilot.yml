name: BAWASLU Gate 1 real-browser isolated write pilot QA

on:
  push:
    branches:
      - architecture-v2-foundation-20261015
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate1-real-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fictional-localhost-browser-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bawaslu_gate1_pilot_ci
          POSTGRES_USER: gate1qa
          POSTGRES_PASSWORD: gate1qa-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gate1qa -d bawaslu_gate1_pilot_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://gate1qa:gate1qa-local-only@127.0.0.1:5432/bawaslu_gate1_pilot_ci
      BAWASLU_ALLOW_ISOLATED_DB_TEST: "YES"
      BAWASLU_GATE1_ISOLATED_E2E: "YES"
      BAWASLU_INBOX_GATE1_READ_ENABLED: "true"
      BAWASLU_INBOX_GATE1_WRITE_ENABLED: "true"
      BAWASLU_INBOX_GATE1_PILOT_MODE: staging
      BAWASLU_INBOX_GATE1_PILOT_CAMPAIGN_IDS: "1"
      BAWASLU_STARTUP_READ_ONLY: "true"
      BAWASLU_CI_PILOT_PASSWORD: Fictional-Gate1-CI-Only-1862!
      OPENAI_API_KEY: ""
      SOCIALCRAWL_API_KEY: ""
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install offline Python dependencies
        run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --prefer-offline --no-audit --no-fund
      - name: Restore isolated Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Seed only the disposable local Postgres
        shell: bash
        run: |
          set -euo pipefail
          echo "GATE1_CI_SEED_FILE=$RUNNER_TEMP/gate1-ids.json" >> "$GITHUB_ENV"
          (cd backend && PYTHONPATH=. python -m scripts.seed_gate1_ci_v1862 "$RUNNER_TEMP/gate1-ids.json")
      - name: Start application API and Vite only on runner localhost
        shell: bash
        run: |
          set -euo pipefail
          (cd backend && PYTHONPATH=. nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/gate1-api.log" 2>&1 &)
          (cd frontend && nohup npm run dev -- --host 127.0.0.1 --port 5173 > "$RUNNER_TEMP/gate1-vite.log" 2>&1 &)
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8000/api/health >/dev/null &&
               curl --fail --silent http://127.0.0.1:5173/login >/dev/null; then
              echo "Both localhost services ready"
              exit 0
            fi
            sleep 2
          done
          echo "Local QA server failed startup"
          tail -n 100 "$RUNNER_TEMP/gate1-api.log" || true
          tail -n 100 "$RUNNER_TEMP/gate1-vite.log" || true
          exit 1
      - name: Execute real UI Gate 1 correction and denied-access cases
        working-directory: frontend
        run: npx playwright test e2e/gate1-write-pilot-v1862.spec.js --project=chromium --workers=1 --retries=0 --reporter=line
      - name: Independently verify audit and operational boundaries in PostgreSQL
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m scripts.verify_gate1_ci_v1862
      - name: Upload isolated UI failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate1-v1862-browser-failures
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Confirm no live service or database was touched
        run: |
          echo "Only fictional QA fixtures were used."
          echo "PostgreSQL was local to the ephemeral CI runner."
          echo "No production credentials, Render config, Supabase rows or paid AI calls were used."
