name: Assistant Offline QA

on:
  push:
    branches: [architecture-v2-foundation-20261015]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assistant-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assistant-regressions:
    name: Deterministic assistant QA (no live AI or staging)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ""
      SOCIALCRAWL_API_KEY: ""
      DATABASE_URL: "sqlite:///:memory:"
      PYTHONPATH: "."
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend QA dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Run actual deterministic answer-quality and saved-answer tests
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q             tests/test_assistant_full_answer_replay_v1607.py             tests/test_saved_answer_audit_v1608.py             tests/test_legal_indonesian_modalities_v1600.py
      - name: Run eight frontend-to-backend regression contracts
        shell: bash
        working-directory: frontend
        run: |
          set -euo pipefail
          node scripts/test-assistant-grounding-v1483.mjs
          node scripts/test-assistant-source-guards-v1489.mjs
          node scripts/test-legal-indonesian-modalities-v1600.mjs
          node scripts/test-legal-policy-boundary-v1601.mjs
          node scripts/test-claim-provenance-v1604.mjs
          node scripts/test-full-answer-replay-v1607.mjs
          node scripts/test-saved-answer-audit-v1608.mjs
          node scripts/test-assistant-retrieval-v1640.mjs
      - name: Summarize QA evidence and limitations
        if: always()
        shell: bash
        run: |
          {
            echo "## BAWASLU offline assistant QA"
            echo ""
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Deterministic Python tests: synthetic full-answer replay, saved-answer audit and Indonesian legal polarity"
            echo "- Eight Node.js source-to-UI contract checks"
            echo "- AI and Socialcrawl keys intentionally empty; local in-memory SQLite"
            echo "- Not a live model run, real PDF source audit, or independent legal accuracy evaluation"
            echo "- Officer acceptance and live staging QA remain pending"
          } >> "$GITHUB_STEP_SUMMARY"
