name: Assistant Offline QA

on:
  push:
    branches: [architecture-v2-foundation-20261015]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assistant-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assistant-regressions:
    name: Deterministic assistant QA (no live AI or staging)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ""
      SOCIALCRAWL_API_KEY: ""
      DATABASE_URL: "sqlite:///:memory:"
      PYTHONPATH: "."
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend QA dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt
      - name: Run actual deterministic answer-quality and saved-answer tests
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --junitxml=assistant-offline-results.xml tests/test_assistant_full_answer_replay_v1607.py tests/test_saved_answer_audit_v1608.py tests/test_legal_indonesian_modalities_v1600.py tests/test_assistant_offline_response_eval.py tests/test_assistant_response_benchmark_p1.py tests/test_assistant_response_benchmark_p2.py tests/test_assistant_multipage_response_qa.py tests/test_assistant_pdf_quote_audit.py tests/test_assistant_pdf_depth_budget.py tests/test_assistant_pdf_depth_contract.py tests/test_exact_pdf_page_grounding_v1500.py tests/test_assistant_citation_consistency.py tests/test_assistant_visible_citations_v17556.py tests/test_assistant_human_review_v1586.py tests/test_assistant_saved_reply_human_packet.py tests/test_assistant_human_review_scoring.py tests/test_assistant_acceptance_evidence_v1588.py tests/test_assistant_acceptance_snapshot.py tests/test_assistant_human_review_cli.py tests/test_assistant_human_review_template.py tests/test_assistant_human_review_csv.py tests/test_assistant_review_preflight.py
      - name: Verify human acceptance remains unapproved without independent review
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from app.assistant_saved_reply_human_packet import build_authorized_saved_reply_review_packet
          from app.assistant_human_review_scoring import compile_human_review_scores
          audit={"selection_method":"EXPLICIT_USER_SELECTED_REPLIES","requested":1,"results":[{
              "thread_id":"123e4567-e89b-12d3-a456-426614174000",
              "answer_revision_token":"a"*64,"answer_message_index":3,"status":"AUDITED",
              "response_quality_triage":{"status":"NO_DETERMINISTIC_FLAGS","diagnostics_complete":True}
          }]}
          packet=build_authorized_saved_reply_review_packet(audit)
          report=compile_human_review_scores(packet,[])
          assert report["complete_self_attested_reviews"]==0
          assert report["release_approved"] is False
          assert report["formal_client_acceptance"] is False
          print("Human acceptance gate correctly remains unapproved without verified reviews")
          PY
      - name: Generate redacted offline answer-triage report
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          python -m app.assistant_offline_response_eval --output assistant-offline-triage.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("assistant-offline-triage.json").read_text(encoding="utf-8"))
          assert report["case_count"]==44
          assert report["accuracy_score"] is None
          assert report["model_calls"]==0
          assert report["human_gold_scoring_completed"] is False
          data=Path("assistant-offline-triage.json").read_text(encoding="utf-8")
          assert "candidate_answer" not in data and "source_excerpt" not in data
          print("Offline triage report verified: 44 synthetic cases, no AI calls, no raw answers.")
          PY
      - name: Generate evidence-based acceptance snapshot
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          python -m app.assistant_acceptance_snapshot \
            --junit assistant-offline-results.xml \
            --triage assistant-offline-triage.json \
            --output assistant-acceptance-snapshot.json
      - name: Upload acceptance snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assistant-acceptance-snapshot
          path: backend/assistant-acceptance-snapshot.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload redacted offline response-triage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assistant-offline-triage-redacted
          path: backend/assistant-offline-triage.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload machine-readable offline QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assistant-offline-pytest
          path: backend/assistant-offline-results.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Run eight frontend-to-backend regression contracts
        shell: bash
        working-directory: frontend
        run: |
          set -euo pipefail
          node scripts/test-assistant-grounding-v1483.mjs
          node scripts/test-assistant-source-guards-v1489.mjs
          node scripts/test-legal-indonesian-modalities-v1600.mjs
          node scripts/test-legal-policy-boundary-v1601.mjs
          node scripts/test-claim-provenance-v1604.mjs
          node scripts/test-full-answer-replay-v1607.mjs
          node scripts/test-saved-answer-audit-v1608.mjs
          node scripts/test-assistant-retrieval-v1640.mjs
      - name: Summarize QA evidence and limitations
        if: always()
        shell: bash
        run: |
          {
            echo "## BAWASLU offline assistant QA"
            echo ""
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Deterministic Python tests: synthetic replay, legal polarity, 100-case PDF/legal/cross-source benchmark, human-review scoring safeguards, 44-case offline response triage, multi-page grounding, exact-page retrieval and saved-answer privacy"
            echo "- Eight Node.js source-to-UI contract checks"
            echo "- AI and Socialcrawl keys intentionally empty; local in-memory SQLite"
            echo "- Not a live model run, real PDF source audit, or independent legal accuracy evaluation"
            echo "- Officer acceptance and live staging QA remain pending"
          } >> "$GITHUB_STEP_SUMMARY"
