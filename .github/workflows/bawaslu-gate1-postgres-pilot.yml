name: BAWASLU Gate 1 isolated PostgreSQL write pilot QA

on:
  push:
    branches:
      - architecture-v2-foundation-20261015
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ephemeral-gate1-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bawaslu_gate1_pilot_ci
          POSTGRES_USER: gate1qa
          POSTGRES_PASSWORD: gate1qa-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gate1qa -d bawaslu_gate1_pilot_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install application test dependencies
        run: pip install -r backend/requirements.txt
      - name: Exercise synthetic QA-only officer writes, append-only history, and row-lock races
        working-directory: backend
        env:
          PYTHONPATH: .
          DATABASE_URL: "sqlite:///:memory:"
          BAWASLU_ALLOW_ISOLATED_DB_TEST: "YES"
          BAWASLU_TEST_DATABASE_URL: "postgresql+psycopg://gate1qa:gate1qa-local-only@127.0.0.1:5432/bawaslu_gate1_pilot_ci"
          OPENAI_API_KEY: ""
          SOCIALCRAWL_API_KEY: ""
        run: pytest -q tests/test_gate1_pilot_postgres_v1861.py tests/test_gate1_fixture_catalog_v1864.py
      - name: Confirm isolation policy
        run: |
          echo "Gate 1 pilot ran only on an ephemeral localhost PostgreSQL service."
          echo "No Supabase, Render, existing officer records or paid AI endpoints were used."
