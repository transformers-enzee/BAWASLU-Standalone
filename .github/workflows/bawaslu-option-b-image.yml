name: BAWASLU Option B - prebuilt staging image

# v175.60: image publication remains explicit and staging-only.
# Manual fallback only; the primary staging image workflow handles automatic publication.
# Normal application changes do not automatically deploy to Render.
on:
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: 'Deploy to image-backed Render staging after manual source verification'
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: bawaslu-option-b-staging
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/transformers-enzee/bawaslu-standalone

jobs:
  build-image:
    if: github.ref == 'refs/heads/architecture-v2-foundation-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out exact approved staging commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check image build inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f Dockerfile
          test -f backend/requirements.txt
          test -f frontend/package.json
          echo "Building from the current staging commit only; no Render build is triggered."
      - name: Validate release source and offline citation regression coverage
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -f backend/tests/test_assistant_visible_citations_v17556.py
          test -f backend/app/assistant_visible_citations.py
          test -f .github/workflows/isolated-bulk-qa.yml
          grep -Fq 'test_assistant_visible_citations_v17556.py' .github/workflows/isolated-bulk-qa.yml
          echo "Source revision and offline citation regression wiring checked."
      - name: Resolve build label from versioned release commit
        id: release
        shell: bash
        run: |
          set -euo pipefail
          subject="$(git log -1 --format=%s)"
          if [[ ! "$subject" =~ ^BAWASLU[[:space:]]v([0-9]+\.[0-9]+): ]]; then
            echo "This pipeline only publishes versioned BAWASLU release commits."
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable staging image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            BAWASLU_BUILD_VERSION=${{ steps.release.outputs.version }}
            BAWASLU_BUILD_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/transformers-enzee/bawaslu-standalone:staging
            ghcr.io/transformers-enzee/bawaslu-standalone:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/transformers-enzee/BAWASLU-Standalone
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=BAWASLU staging
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          cache-from: type=gha,scope=bawaslu-staging
          cache-to: type=gha,mode=max,scope=bawaslu-staging
      - name: Document source SHA and published image digest
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$IMAGE_DIGEST"
          case "$IMAGE_DIGEST" in sha256:*) ;; *) echo "Invalid Docker digest"; exit 1 ;; esac
          {
            echo "## BAWASLU v$RELEASE_VERSION staging image"
            echo ""
            echo "Source commit: \`$COMMIT_SHA\`"
            echo "Immutable tag: \`ghcr.io/transformers-enzee/bawaslu-standalone:sha-$COMMIT_SHA\`"
            echo "Published digest: \`$IMAGE_DIGEST\`"
            echo "Mutable staging alias: \`ghcr.io/transformers-enzee/bawaslu-standalone:staging\`"
            echo ""
            echo "Image published for linux/amd64. Render deployment was NOT performed by this push workflow."
            echo "For Render staging, use the immutable tag above after verifying the successful build."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-staging:
    needs: build-image
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_staging == true && github.ref == 'refs/heads/architecture-v2-foundation-20261015'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SOURCE_CONFIRMED: ${{ vars.BAWASLU_STAGING_IMAGE_READY }}
      RENDER_STAGING_DEPLOY_HOOK: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}
      IMAGE_REF: ghcr.io/transformers-enzee/bawaslu-standalone:sha-${{ github.sha }}
    steps:
      - name: Require explicit image-backed staging confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [ "$SOURCE_CONFIRMED" != "true" ]; then
            echo "BLOCKED: set BAWASLU_STAGING_IMAGE_READY=true only after confirming the Render staging service uses this GHCR image."
            exit 1
          fi
          if [ -z "$RENDER_STAGING_DEPLOY_HOOK" ]; then
            echo "BLOCKED: staging deploy hook secret is not configured."
            exit 1
          fi
      - name: Deploy immutable image tag without a Render-side build
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          hook = os.environ["RENDER_STAGING_DEPLOY_HOOK"]
          if not hook.startswith("https://api.render.com/deploy/"):
              raise SystemExit("Invalid Render staging deploy hook format")
          image = os.environ["IMAGE_REF"]
          separator = "&" if "?" in hook else "?"
          url = hook + separator + "imgURL=" + quote(image, safe="")
          with urlopen(Request(url, method="POST"), timeout=30) as response:
              if response.status not in (200, 202):
                  raise SystemExit("Staging image deploy was not accepted")
          print("Render accepted the image-backed staging deployment request.")
          PY
      - name: Record deploy acceptance limits
        shell: bash
        run: |
          echo "Render deploy requested for immutable image ${{ github.sha }}." >> "$GITHUB_STEP_SUMMARY"
          echo "This confirms a request, not successful startup, migrations, health checks or officer acceptance." >> "$GITHUB_STEP_SUMMARY"
