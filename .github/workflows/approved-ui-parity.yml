name: Approved UI visual-parity build checks
on:
  push:
    branches:
      - architecture-v2-foundation-20261015
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'docs/UI_FREEZE_2026-10-28.md'
      - 'docs/FIVE_MODULE_INTEGRATION_QA_2026-10-28.md'
      - '.github/workflows/approved-ui-parity.yml'
  workflow_dispatch:
jobs:
  validate-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate embedded prototype scripts and live adapters
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          assets=Path('frontend/public/ui-freeze')
          for name in ('smart-radar-v6_2','watchlist-v2_2'):
              text=(assets/(name+'.html')).read_text(encoding='utf-8')
              scripts=[body for body in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.DOTALL) if body.strip()]
              if len(scripts)!=1 or not scripts[0].strip():
                  raise SystemExit(f'Expected one inline prototype script in {name}')
              Path('/tmp/'+name+'.js').write_text(scripts[0],encoding='utf-8')
          PY
          node --check /tmp/smart-radar-v6_2.js
          node --check /tmp/watchlist-v2_2.js
          node --check frontend/public/ui-freeze/smart-radar-live.js
          node --check frontend/public/ui-freeze/watchlist-live.js
      - name: Check five-module integration and source evidence contracts
        working-directory: frontend
        run: |
          node scripts/check-command-centre-v1090.mjs
          node scripts/check-command-centre-v1097.mjs
          node scripts/test-command-centre-v1098.mjs
          node scripts/check-integration-contract.mjs
          node scripts/check-radar-pilot-ui.mjs
      - name: Smoke test Smart Radar and Watchlist startup without network calls
        working-directory: frontend
        run: node scripts/smoke-ui-freeze.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test authenticated Assistant history and backend syntax
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt
          python -m compileall -q app
          python -m pytest -q tests/test_topic_themes_v1069.py tests/test_campaign_captured_posts_full.py tests/test_sentiment_backfill_v1093.py tests/test_command_centre_v1090.py tests/test_command_centre_sections_v1089.py tests/test_inbox_read_cache_v1081.py tests/test_candidate_mentions_dedupe_v1088.py tests/test_candidate_alias_radar_v1076.py tests/test_narrative_patterns_v1085.py tests/test_live_inbox_radar_v1075.py tests/test_human_verified_import_v1074.py tests/test_shared_violation_hard_cases_v107.py tests/test_assistant_history.py tests/test_source_ids.py tests/test_source_id_backfill.py tests/test_integration_readiness.py tests/test_integration_safety_contract.py tests/test_import_quality.py tests/test_source_lineage.py tests/test_release_contracts.py tests/test_classification_enrichment.py tests/test_summary_readiness_v992.py tests/test_acceptance_next_actions_v991.py tests/test_bulk_acceptance_v995.py tests/test_acceptance_batch_v996.py tests/test_topic_quality_v997.py tests/test_officer_classification_v999.py tests/test_officer_dispatch_v1001.py tests/test_pipeline_workflow_v1002.py tests/test_cross_module_player_contract.py tests/test_source_lineage_shared_v1004.py tests/test_multi_workflow_acceptance_v1005.py tests/test_scope_guard_v1008.py tests/test_bulk_workflow_contract_v1009.py tests/test_batch1_completion_v101.py tests/test_inbox_radar_feed_v1012.py tests/test_radar_route_order_v1021.py tests/test_radar_full_feed_v1027.py tests/test_cross_module_lineage_v1029.py tests/test_three_open_gates_v103.py tests/test_open_acceptance_v1034.py tests/test_v104_actual_closure_work.py tests/test_staging_readiness_v1013.py tests/test_radar_feed_integrity_v1015.py tests/test_command_centre_titles_v1097.py tests/test_issue_distribution_v1112.py tests/test_live_inbox_radar_v1075.py tests/test_command_centre_v1090.py
      - name: Build existing React app with the approved HTML assets
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
