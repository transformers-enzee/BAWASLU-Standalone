name: BAWASLU v175.83 staging Docker image
# Phase 1 QA retry: preserve Command Centre masthead; ensure source consent and draft-only execution guards.
# Publish only after the full frontend and backend Dockerfile test gates have passed.

on:
  push:
    branches:
      - architecture-v2-foundation-20261015
    paths:
      - ".github/workflows/bawaslu-v17583-ghcr-image.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: bawaslu-v17583-ghcr-image
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build verified image, publish to GHCR (no Render deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push only if Dockerfile tests succeed
        id: image_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            BAWASLU_BUILD_VERSION=175.83
            BAWASLU_BUILD_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/transformers-enzee/bawaslu-standalone:v175.83
            ghcr.io/transformers-enzee/bawaslu-standalone:sha-${{ github.sha }}
          provenance: false
      - name: Record published image digest for manual staging deployment
        env:
          IMAGE_DIGEST: ${{ steps.image_build.outputs.digest }}
        run: |
          mkdir -p release-manifests
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload={
            "version":"175.83",
            "source_commit":os.environ["GITHUB_SHA"],
            "image":"ghcr.io/transformers-enzee/bawaslu-standalone",
            "tag":"v175.83",
            "digest":os.environ["IMAGE_DIGEST"],
            "image_reference":"ghcr.io/transformers-enzee/bawaslu-standalone@"+os.environ["IMAGE_DIGEST"],
            "github_run":f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
            "deployment":"not_deployed_to_render",
          }
          Path("release-manifests/v17583.json").write_text(
              json.dumps(payload,indent=2)+"\n",encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-manifests/v17583.json
          git commit -m "Verify published BAWASLU v175.83 GHCR image digest"
          git push origin HEAD:refs/heads/architecture-v2-foundation-20261015
      - name: Write exact image reference to job summary
        run: |
          echo "BAWASLU v175.83 image published after Dockerfile checks." >> "${GITHUB_STEP_SUMMARY}"
          echo "ghcr.io/transformers-enzee/bawaslu-standalone:v175.83" >> "${GITHUB_STEP_SUMMARY}"
          echo "ghcr.io/transformers-enzee/bawaslu-standalone:sha-${GITHUB_SHA}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Record safe CI run ID when build fails (no secrets or data)
        if: failure()
        run: |
          mkdir -p ci-diagnostics
          printf '{"version":"175.83","source_commit":"%s","run_id":%s,"status":"FAILED_CI_CHECKS","no_provider_calls":true}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > ci-diagnostics/v17583-last-failed-run.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-diagnostics/v17583-last-failed-run.json
          git commit -m "Record BAWASLU v175.83 failed CI run ID for safe inspection"
          git pull --rebase origin architecture-v2-foundation-20261015
          git push origin HEAD:refs/heads/architecture-v2-foundation-20261015
