name: BAWASLU v188.1 compact officer Gate 1 QA
on:
  push:
    branches:
      - architecture-v2-foundation-20261015
  workflow_dispatch:
permissions:
  contents: read
jobs:
  operator-ux-and-backend-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: bawaslu_gate1_isolated_qa_db
          POSTGRES_USER: bawaslu_gate1_isolated_qa_db_user
          POSTGRES_PASSWORD: qa-ci-ephemeral-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bawaslu_gate1_isolated_qa_db_user -d bawaslu_gate1_isolated_qa_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Verify simplified UX contracts and immutable-source officer correction workflow
        working-directory: backend
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+psycopg://bawaslu_gate1_isolated_qa_db_user:qa-ci-ephemeral-only@127.0.0.1:5432/bawaslu_gate1_isolated_qa_db
          BAWASLU_ALLOW_ISOLATED_DB_TEST: "YES"
          BAWASLU_GATE1_QA_BOOTSTRAP: "YES"
          BAWASLU_GATE1_QA_ISOLATED: "YES"
          BAWASLU_STARTUP_READ_ONLY: "1"
          BAWASLU_GATE1_QA_ADMIN_PASSWORD: "CI-Dummy-Admin-Pass-1869-Only!"
          BAWASLU_GATE1_QA_VIEWER_PASSWORD: "CI-Dummy-Viewer-Pass-1869-Only!"
          OPENAI_API_KEY: ""
          SOCIALCRAWL_API_KEY: ""
        run: pytest -q tests/test_gate1_simplified_v1869.py tests/test_gate1_full_workbench_v1868.py tests/test_gate1_contextual_v1871.py tests/test_gate1_focused_v1874.py tests/test_gate1_bawaslu_v1875.py tests/test_gate1_relevance_v1876.py tests/test_gate1_variable_control_v1879.py tests/test_gate1_compact_v1880.py
