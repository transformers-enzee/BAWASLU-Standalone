name: Supabase Security Staging QA

on:
  push:
    branches: [architecture-v2-foundation-20261015]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  postgres-security:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bawaslu_security_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bawaslu_security_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/bawaslu_security_ci
      SECURITY_TEST_DSN: postgresql://postgres:postgres@localhost:5432/bawaslu_security_ci
      PYTHONPATH: backend
      OPENAI_API_KEY: ""
      SOCIALCRAWL_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Apply complete Alembic schema to ephemeral PostgreSQL
        working-directory: backend
        run: alembic upgrade head
      - name: Test protected Supabase-style access-control changes
        run: python backend/scripts/check_supabase_security_ci.py
