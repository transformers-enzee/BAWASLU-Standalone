name: BAWASLU v175.76 staging Docker image

on:
  push:
    branches:
      - architecture-v2-foundation-20261015
    paths:
      - ".github/workflows/bawaslu-v17576-ghcr-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: bawaslu-v17576-ghcr-image
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build verified image, publish to GHCR (no Render deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push only if Dockerfile tests succeed
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            BAWASLU_BUILD_VERSION=175.76
            BAWASLU_BUILD_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/transformers-enzee/bawaslu-standalone:v175.76
            ghcr.io/transformers-enzee/bawaslu-standalone:sha-${{ github.sha }}
          provenance: false
      - name: Write exact image reference to job summary
        run: |
          echo "BAWASLU v175.76 image published after Dockerfile checks." >> "${GITHUB_STEP_SUMMARY}"
          echo "ghcr.io/transformers-enzee/bawaslu-standalone:v175.76" >> "${GITHUB_STEP_SUMMARY}"
          echo "ghcr.io/transformers-enzee/bawaslu-standalone:sha-${GITHUB_SHA}" >> "${GITHUB_STEP_SUMMARY}"
