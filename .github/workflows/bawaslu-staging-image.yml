name: BAWASLU staging Docker image (verified)

on:
  push:
    branches:
      - architecture-v2-foundation-20261015
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: bawaslu-staging-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-regression:
    if: github.ref == 'refs/heads/architecture-v2-foundation-20261015'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Full offline backend regression (authoritative release gate)
        working-directory: backend
        env:
          PYTHONPATH: .
          DATABASE_URL: 'sqlite:///:memory:'
          OPENAI_API_KEY: ""
          SOCIALCRAWL_API_KEY: ""
        run: pytest -q
  verify-and-publish:
    needs: backend-regression
    if: github.ref == 'refs/heads/architecture-v2-foundation-20261015'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout staging source
        uses: actions/checkout@v4
      - name: Resolve sequential image version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^ARG BAWASLU_BUILD_VERSION=//p' Dockerfile | head -1)"
          if [[ ! "$VERSION" =~ ^[0-9]+[.][0-9]+$ ]]; then
            echo "Invalid Docker build version"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR (no Render deployment)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package runtime and publish after backend QA and frontend build checks
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ghcr.io/transformers-enzee/bawaslu-standalone:staging-${{ steps.version.outputs.version }}
            ghcr.io/transformers-enzee/bawaslu-standalone:staging-${{ github.sha }}
            ghcr.io/transformers-enzee/bawaslu-standalone:sha-${{ github.sha }}
            ghcr.io/transformers-enzee/bawaslu-standalone:staging
          build-args: |
            BAWASLU_BUILD_VERSION=${{ steps.version.outputs.version }}
            BAWASLU_BUILD_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=bawaslu-staging
          cache-to: type=gha,mode=max,scope=bawaslu-staging,ignore-error=true
          provenance: true
      - name: Confirm image identity
        run: |
          echo "Published staging image for commit ${{ github.sha }}; no Render deployment initiated."
