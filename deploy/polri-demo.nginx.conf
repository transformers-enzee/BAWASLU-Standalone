# Host only the frozen /demo SPA; never proxy requests to the BAWASLU backend.
server {
    listen 10000;
    # Render terminates HTTPS; redirects must not publish this internal port.
    absolute_redirect off;
    port_in_redirect off;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /polri-logo.png { try_files $uri =404; }
    location = /healthz { access_log off; return 200 "ok"; }
    location = / { return 302 /demo/; }
    location = /demo { return 302 /demo/; }
    # The Vite build includes public/demo/ as a physical directory with no index.
    # Exact route must bypass directory lookup and serve the SPA entrypoint.
    location = /demo/ { rewrite ^ /index.html last; }
    location ^~ /api/ { return 403; }
    location ^~ /uploads/ { return 403; }
    location ^~ /demo/ {
        # Preserve exact demo mock HTML/JS files and fall back to the React
        # entrypoint for deep links, including refresh on /demo/inbox.
        try_files $uri /index.html;
    }
    location = /index.html { internal; }
    location ^~ /assets/ { try_files $uri =404; }
    location ^~ /ui-freeze/ { try_files $uri =404; }
    # Static demo resources (logo, favicon, mock HTML, images).
    location ~* ^/[a-zA-Z0-9_-]+\\.(svg|png|webp|ico|jpg|jpeg|woff2?)$ {
        try_files $uri =404;
    }
    location / { return 404; }
}
