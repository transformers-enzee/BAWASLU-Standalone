name: Playwright QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run backend QA
        working-directory: backend
        env:
          PYTHONPATH: .
          DATABASE_URL: 'sqlite:///:memory:'
          OPENAI_API_KEY: ""
          SOCIALCRAWL_API_KEY: ""
        run: pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build production frontend
        working-directory: frontend
        env:
          VITE_OPENAI_API_KEY: ""
          VITE_SOCIALCRAWL_API_KEY: ""
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright QA
        working-directory: frontend
        run: npx playwright test --grep-invert "provincial analyst only sees permitted navigation|Data Sources create and edit persists|unresolved jurisdiction blocks final validation"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14
