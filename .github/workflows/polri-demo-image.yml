name: POLRI subdomain - offline demo image
on:
  push:
    branches: [architecture-v2-foundation-20261015]
    paths:
      - '.github/workflows/polri-demo-image.yml'
      - 'Dockerfile.polri-demo'
      - 'deploy/polri-demo.nginx.conf'
      - 'frontend/**'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: polri-demo-image
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build a standalone demo-only image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.polri-demo
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/transformers-enzee/bawaslu-standalone:polri-demo
            ghcr.io/transformers-enzee/bawaslu-standalone:polri-demo-sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/transformers-enzee/BAWASLU-Standalone
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=polri-demo
          cache-to: type=gha,mode=max,scope=polri-demo
      - name: Confirm no Render deployment happened
        run: |
          echo 'Published offline demo image only; no new Render service or DNS mapping is created by this workflow.' >> "$GITHUB_STEP_SUMMARY"
