services:
  - type: web
    name: bawaslu-intelligence
    runtime: docker
    repo: https://github.com/transformers-enzee/BAWASLU-Standalone
    branch: main
    region: singapore
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bawaslu-postgres
          property: connectionString
      - key: BAWASLU_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BAWASLU_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: SOCIALCRAWL_API_KEY
        sync: false
      - key: SOCIALCRAWL_BASE_URL
        value: https://api.socialcrawl.dev
      - key: CORS_ORIGINS
        sync: false
      - key: UPLOAD_DIR
        value: /tmp/bawaslu-uploads

databases:
  - name: bawaslu-postgres
    region: singapore
    plan: free
    databaseName: bawaslu
    user: bawaslu
    postgresMajorVersion: "18"
