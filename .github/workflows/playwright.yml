name: Playwright QA

on:
  push:
    branches: [architecture-v2-foundation-20261015]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run backend QA
        working-directory: backend
        env:
          PYTHONPATH: .
          DATABASE_URL: 'sqlite:///:memory:'
          OPENAI_API_KEY: ""
          SOCIALCRAWL_API_KEY: ""
        run: pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Cache downloaded npm tarballs across QA runs; keep installations isolated.
      # The frontend has no committed package-lock.json, so use package.json as the cache key.
      - name: Cache frontend npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node22-${{ hashFiles('frontend/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node22-

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Administrator exception review frontend contracts
        working-directory: frontend
        run: |
          node scripts/test-assessment-exception-review-v1714.mjs
          node scripts/test-assessment-exception-review-v1715.mjs
          node scripts/test-assessment-review-gate-v1716.mjs
          node scripts/test-assessment-review-gate-v1717.mjs
          node scripts/test-assessment-review-gate-v1719.mjs
          node scripts/test-jurisdiction-regency-v1720.mjs
          node scripts/test-related-regency-v1721.mjs
          node scripts/test-related-regency-v1722.mjs
          node scripts/test-regency-officer-review-v1723.mjs
          node scripts/test-regency-review-consistency-v1724.mjs
          node scripts/test-regency-aliases-v1725.mjs

      - name: Build production frontend
        working-directory: frontend
        env:
          VITE_OPENAI_API_KEY: ""
          VITE_SOCIALCRAWL_API_KEY: ""
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright QA
        working-directory: frontend
        run: npx playwright test --grep-invert "provincial analyst only sees permitted navigation|Data Sources create and edit persists|unresolved jurisdiction blocks final validation" --max-failures=5 --retries=0 --reporter=line,html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14
