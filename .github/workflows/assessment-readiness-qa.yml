name: AI Assessment Readiness QA
on:
  push:
    branches:
      - architecture-v2-foundation-20261015
    paths:
      - 'backend/app/auto_relevance.py'
      - 'backend/app/main.py'
      - 'backend/tests/test_assessment_readiness_contract.py'
      - '.github/workflows/assessment-readiness-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-assessment-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax verification
        run: python -m py_compile backend/app/auto_relevance.py backend/app/main.py backend/tests/test_assessment_readiness_contract.py
      - name: No-cost assessment contract regression
        run: python -m unittest discover -s backend/tests -p 'test_assessment_readiness_contract.py' -v
