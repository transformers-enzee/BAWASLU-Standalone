name: BAWASLU staging image release dispatcher

# Lives on the default branch so the GitHub Actions "Run workflow" control
# is available. This file does not deploy to Render or modify application code.
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Full 40-character SHA at the head of the approved staging development branch'
        required: true
        type: string
        default: 'f3d80f44a815134e21004e3103a5bb41473a4a49'

permissions:
  contents: read
  packages: write

concurrency:
  group: bawaslu-option-b-staging
  cancel-in-progress: false

jobs:
  publish-approved-image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out the approved BAWASLU development branch
        uses: actions/checkout@v4
        with:
          ref: architecture-v2-foundation-20261015
          persist-credentials: false
      - name: Require exact branch-head commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          if ! [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'ERROR: commit_sha must be a full lowercase 40-character SHA.'
            exit 1
          fi
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "ERROR: staging branch head is $ACTUAL_SHA, not the requested $EXPECTED_SHA"
            exit 1
          fi
          test -f Dockerfile
          test -f backend/requirements.txt
          test -f frontend/package.json
          echo "Verified staging source SHA: $ACTUAL_SHA"
      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable image only
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/transformers-enzee/bawaslu-standalone:sha-${{ inputs.commit_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/transformers-enzee/BAWASLU-Standalone
            org.opencontainers.image.revision=${{ inputs.commit_sha }}
          cache-from: type=gha,scope=bawaslu-staging
          cache-to: type=gha,mode=max,scope=bawaslu-staging
      - name: Record immutable artifact and release boundary
        shell: bash
        env:
          SHA: ${{ inputs.commit_sha }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          {
            echo "## Approved BAWASLU staging image"
            echo ""
            echo "Source commit: `$SHA`"
            echo "Image: `ghcr.io/transformers-enzee/bawaslu-standalone:sha-$SHA`"
            echo "Digest: `$DIGEST`"
            echo ""
            echo "This workflow publishes an image only. It does not move the staging alias, trigger Render, access Supabase, or call paid AI."
            echo "Verify the digest and staging readiness before a separate deployment."
          } >> "$GITHUB_STEP_SUMMARY"
