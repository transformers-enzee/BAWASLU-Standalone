name: BAWASLU isolated bulk QA
on:
  push:
    branches: [bulk-development-20261119, architecture-v2-foundation-20261015]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bawaslu-isolated-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile backend and CLI
        run: python -m compileall -q backend/app backend/scripts
      - name: AI-5 saved chat and share privacy regression
        working-directory: backend
        run: python -m pytest -q tests/test_ai5_saved_shares_v1808.py tests/test_ai5_auto_history_v1834.py
        env:
          OPENAI_API_KEY: ''
          DATABASE_URL: sqlite:////tmp/bawaslu-ai5-save-share-qa.sqlite3
      - name: AI-5 qualitative research cross-topic regression
        working-directory: backend
        run: python -m pytest -q tests/test_ai5_qualitative_regression_v1803.py tests/test_ai5_evidence_flow_v1800.py
        env:
          OPENAI_API_KEY: ''
          DATABASE_URL: sqlite:////tmp/bawaslu-bulk-qa.sqlite3
      - name: Deterministic assistant depth and citation QA
        working-directory: backend
        run: python -m pytest -q tests/test_assistant_pdf_depth_contract.py tests/test_assessment_qa_flags.py tests/test_assistant_question_coverage.py tests/test_zocialeye_resume_integrity.py tests/test_assistant_pdf_depth_budget.py tests/test_assistant_citation_consistency.py tests/test_assistant_visible_citations_v17556.py tests/test_assistant_pdf_quote_audit.py tests/test_assistant_formal_decision_provenance.py tests/test_assistant_platform_verdict_provenance.py tests/test_assistant_legacy_readiness_contract.py tests/test_assistant_combined_acceptance.py tests/test_assistant_response_benchmark_p1.py tests/test_assistant_response_benchmark_p2.py tests/test_assistant_source_claim_requirements.py tests/test_assistant_multipage_response_qa.py tests/test_assistant_cross_source_response_qa.py tests/test_assistant_offline_response_eval.py tests/test_assistant_saved_reply_response_triage.py tests/test_assistant_saved_reply_human_packet.py tests/test_assistant_human_review_scoring.py tests/test_assistant_saved_reply_live_review_route.py tests/test_saved_reply_eval_v1616.py tests/test_saved_reply_batch_v1618.py tests/test_saved_reply_review_routes_v1628.py
        env:
          OPENAI_API_KEY: ''
          DATABASE_URL: sqlite:////tmp/bawaslu-bulk-qa.sqlite3
      - name: Produce redacted zero-credit Assistant QA report
        working-directory: backend
        run: python -m app.assistant_offline_response_eval --output assistant-offline-qa-report.json
        env:
          OPENAI_API_KEY: ''
          DATABASE_URL: sqlite:////tmp/bawaslu-bulk-qa.sqlite3
      - name: Upload Assistant QA report
        uses: actions/upload-artifact@v4
        with:
          name: assistant-offline-qa-report
          path: backend/assistant-offline-qa-report.json
          retention-days: 7
          if-no-files-found: error
  frontend-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend
        working-directory: frontend
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: AI-5 Saved Chats and share navigation contract
        working-directory: frontend
        run: node scripts/test-ai5-saved-shares-v1808.mjs
      - name: AI-5 automatic conversation history regression
        working-directory: frontend
        run: node scripts/test-ai5-auto-history-v1834.mjs
      - name: AI-5 Saved Chats user experience regression
        working-directory: frontend
        run: node scripts/test-ai5-saved-chats-ux-v1810.mjs
      - name: AI-5 Saved Chats small-list navigation regression
        working-directory: frontend
        run: node scripts/test-ai5-saved-chat-toggle-v1812.mjs
      - name: Build frontend
        working-directory: frontend
        run: npm run build
